[project]
name = "face-service"
version = "0.1.0"
description = "Face detection + recognition service (insightface + onnxruntime, CPU-first)"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Pinned to 0.7.3: the last release before the 0.7.x packaging churn, and
    # the one with broadly available cp312 wheels on Windows.
    "insightface==0.7.3",
    # Plain onnxruntime, NOT onnxruntime-gpu. This machine has an Intel UHD 620
    # and no CUDA device, so the GPU build cannot load. See README for swapping.
    "onnxruntime==1.19.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26,<3",
    "pillow>=10.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Installed only on a CUDA box. onnxruntime-gpu and onnxruntime CANNOT both be
# present: they ship the same `onnxruntime` import path and the second install
# clobbers the first. Uninstall one before installing the other.
gpu = [
    "onnxruntime-gpu==1.19.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]